<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여의주 · 인하대 졸업요건 체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="app-header" class="app-header">
  <div class="app-header__inner container">
    <button type="button" id="header-brand" class="app-header__brand" aria-label="메인 대시보드로 이동">
      <span class="orb orb--logo" aria-hidden="true"></span>
      <span class="app-header__title">여의주</span>
      <span class="app-header__subtitle">인하대 졸업요건 체크</span>
    </button>

    <nav id="header-menu" class="app-header__menu" hidden>
      <a href="#dashboard" class="menu-item" data-action="navigate" data-route="dashboard">대시보드</a>
      <a href="#" class="menu-item" data-action="open-modal">과목 입력</a>
      <a href="#next" class="menu-item" data-action="go-next-or-freshman" data-route="next">다음 학기 추천</a>
      <a href="#" class="menu-item" data-action="toast-wip">교양 추천</a>
      <a href="#" class="menu-item" data-action="toast-wip">시간표</a>
    </nav>

    <div id="header-dept-info" class="app-header__dept" hidden>
      <span class="app-header__divider" aria-hidden="true"></span>
      <span id="header-dept-text"></span>
      <a href="#" id="header-change-dept" class="app-header__change">변경</a>
    </div>

    <div id="header-tagline" class="app-header__tagline" hidden>인하대학교 재학생을 위한 졸업요건 도우미</div>
  </div>
</header>

<main>
  <section id="view-start" class="view"></section>
  <section id="view-dashboard" class="view" hidden></section>
  <section id="view-guide" class="view" hidden></section>
  <section id="view-next" class="view" hidden></section>
  <section id="view-freshman" class="view" hidden></section>
</main>

<div id="modal-root"></div>

<div id="loading-overlay" class="overlay">
  <div class="loading-panel">
    <div class="loading-orbs">
      <span class="loading-orb loading-orb--total"></span>
      <span class="loading-orb loading-orb--major"></span>
      <span class="loading-orb loading-orb--general"></span>
      <span class="loading-orb loading-orb--cert"></span>
    </div>
    <p class="loading-text">여의주 찾는 중…</p>
  </div>
</div>

<div id="error-overlay" class="overlay">
  <div class="error-panel">
    <p class="error-title">학과 정보를 불러올 수 없어요</p>
    <p class="error-desc">네트워크를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" id="error-retry-btn" class="btn btn--primary">다시 시도</button>
  </div>
</div>

<div id="toast-root" class="toast" aria-live="polite"></div>

<script src="js/toast.js"></script>
<script src="js/curriculum-data.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/render-common.js"></script>
<script src="js/render-start.js"></script>
<script src="js/render-dashboard.js"></script>
<script src="js/render-modal.js"></script>
<script src="js/render-guide.js"></script>
<script src="js/render-next.js"></script>
<script src="js/render-freshman.js"></script>
<script src="js/app.js"></script>
</body>
</html>
